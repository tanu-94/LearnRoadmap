<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LearnRoadmap — Complete End-to-End Data Analyst Hub</title>
<style>
:root{
  --cream:#f7f1e6; --cream2:#efe6d4; --denim:#2f4a63; --denim2:#3d5f7d;
  --ink:#26313a; --accent:#d97b3f; --accent2:#6a8a5f; --card:#fffaf0; --border:#d9cdb3;
  --code-bg:#232b32; --code-text:#e6edf3;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --cream:#1c2128; --cream2:#242b33; --ink:#eee6d3; --card:#232a32; --border:#3a4653; --denim:#7fa5c4; --code-bg:#151b23; --code-text:#f0f6fc;
  }
}
:root[data-theme="dark"]{
  --cream:#1c2128; --cream2:#242b33; --ink:#eee6d3; --card:#232a32; --border:#3a4653; --denim:#7fa5c4; --code-bg:#151b23; --code-text:#f0f6fc;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Courier New',ui-monospace,monospace;min-height:100%;}
header{background:var(--denim);color:#fdf6e8;padding:24px 16px calc(18px + env(safe-area-inset-top,0px));text-align:center;}
header h1{margin:0 0 6px;font-size:1.65rem;}
header p{margin:0 auto;opacity:.9;font-size:.88rem;max-width:760px;line-height:1.4;}
nav{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:10px 14px;background:var(--cream2);position:sticky;top:0;z-index:10;border-bottom:2px solid var(--border);}
nav button{font-family:inherit;font-size:.8rem;padding:7px 12px;border-radius:20px;border:2px solid var(--border);background:var(--card);color:var(--ink);cursor:pointer;transition:all .15s ease;}
nav button:hover{border-color:var(--accent);}
nav button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
main{max-width:980px;margin:0 auto;padding:22px 16px 60px;}
h2{color:var(--denim);border-bottom:3px solid var(--accent);display:inline-block;padding-bottom:3px;margin-top:0;}
p.subhead{font-size:.86rem;opacity:.85;margin-top:4px;margin-bottom:18px;line-height:1.45;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-top:14px;}
.card{background:var(--card);border:2px solid var(--border);border-radius:10px;min-height:140px;padding:14px;cursor:pointer;position:relative;display:flex;flex-direction:column;justify-content:space-between;transition:transform .12s ease, box-shadow .12s ease;}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,0.06);}
.card .front{font-weight:bold;color:var(--denim);font-size:.95rem;}
.card .front small{display:block;font-weight:normal;color:var(--ink);opacity:.7;margin-top:8px;font-size:.75rem;}
.card .back{display:none;font-size:.8rem;line-height:1.45;white-space:pre-wrap;}
.card.flipped .front{display:none;}
.card.flipped .back{display:block;}
.card .tag{display:inline-block;background:var(--accent2);color:#fff;font-size:.65rem;padding:2px 8px;border-radius:10px;margin-bottom:8px;}
.hint{font-size:.7rem;opacity:.6;align-self:flex-end;margin-top:10px;}
.steps{margin-top:14px;}
.step{background:var(--card);border-left:5px solid var(--accent);border-radius:6px;padding:14px;margin-bottom:12px;}
.step b{color:var(--denim);font-size:.95rem;}
.step div{margin-top:5px;font-size:.85rem;line-height:1.45;}
.quiz-card{background:var(--card);border:2px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px;}
.quiz-card p.q{font-weight:bold;color:var(--denim);margin-top:0;font-size:.92rem;}
.quiz-card .ans{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);font-size:.85rem;line-height:1.45;}
.quiz-card button.reveal{font-family:inherit;background:var(--accent);color:#fff;border:none;border-radius:20px;padding:6px 14px;cursor:pointer;font-size:.8rem;}
.guide-controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;align-items:center;}
.guide-search{flex:1;min-width:240px;padding:9px 14px;border:2px solid var(--border);border-radius:8px;font-family:inherit;font-size:.85rem;background:var(--card);color:var(--ink);}
.guide-search:focus{outline:none;border-color:var(--accent);}
.guide-filter-pills{display:flex;flex-wrap:wrap;gap:6px;}
.guide-pill{font-family:inherit;font-size:.75rem;padding:5px 10px;border-radius:14px;border:1px solid var(--border);background:var(--card);color:var(--ink);cursor:pointer;}
.guide-pill.active{background:var(--denim2);color:#fff;border-color:var(--denim2);}
.guide-entry{background:var(--card);border:2px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px;}
.guide-entry h3{margin:0 0 6px;color:var(--denim);font-size:1.02rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;}
.guide-entry .category-badge{font-size:.65rem;background:var(--accent2);color:#fff;padding:2px 8px;border-radius:10px;font-weight:normal;}
.guide-entry .section-row{margin:6px 0;font-size:.84rem;line-height:1.45;}
.guide-entry .section-row strong{color:var(--denim2);}
.guide-entry pre{background:var(--code-bg);color:var(--code-text);padding:10px 12px;border-radius:6px;font-size:.8rem;overflow-x:auto;position:relative;margin:8px 0;}
.guide-entry code{font-family:'Courier New',ui-monospace,monospace;}
.copy-btn{position:absolute;top:6px;right:6px;background:rgba(255,255,255,0.2);border:none;border-radius:4px;color:#fff;font-size:.7rem;padding:3px 7px;cursor:pointer;}
.copy-btn:hover{background:rgba(255,255,255,0.4);}
.flow-box{background:var(--card);border:2px solid var(--border);border-radius:10px;padding:18px;margin-bottom:16px;}
.flow-diagram{display:flex;flex-direction:column;align-items:center;margin:18px 0;}
.flow-node{background:var(--cream2);border:2px solid var(--denim);color:var(--denim);padding:8px 16px;border-radius:8px;font-weight:bold;font-size:.85rem;text-align:center;width:80%;max-width:400px;}
.flow-arrow{color:var(--accent);font-size:1.2rem;font-weight:bold;margin:3px 0;}
table.road-table{width:100%;border-collapse:collapse;margin:14px 0;font-size:.83rem;}
table.road-table th, table.road-table td{border:1px solid var(--border);padding:8px 10px;text-align:left;}
table.road-table th{background:var(--cream2);color:var(--denim);}
footer{text-align:center;padding:20px;font-size:.75rem;opacity:.65;}
</style>
</head>

        <li><strong>Lookup Logic:</strong> Master <code>XLOOKUP</code> conceptually: <em>"Find this key in another dataset and bring back the corresponding value."</em> This directly mirrors SQL JOINs, Pandas merges, and Power BI relationships.</li>
        <li><strong>Data Cleaning:</strong> Remove duplicates, Text to Columns, Flash Fill, Data Validation, and converting ranges to <code>Ctrl + T</code> structured tables.</li>
        <li><strong>Analysis & Viz:</strong> Pivot Tables (Rows, Columns, Values, Filters), Slicers, and intentional chart selection (Trends → Line; Categories → Bar; Relationships → Scatter; Distributions → Histogram).</li>
      </ul>
    `
  },
  {
    title: "5. SQL — The Core Data Skill",
    content: `
      <p>SQL is how you query relational databases directly. Progress through 11 core levels:</p>
      <ol>
        <li><strong>Basic Querying:</strong> SELECT, FROM, DISTINCT, LIMIT</li>
        <li><strong>Filtering:</strong> WHERE, AND, OR, NOT, IN, BETWEEN, LIKE</li>
        <li><strong>Sorting:</strong> ORDER BY (ASC / DESC)</li>
        <li><strong>Aggregation:</strong> COUNT, SUM, AVG, MIN, MAX with GROUP BY</li>
        <li><strong>Group Filtering:</strong> HAVING (filters aggregated groups) vs WHERE (filters rows before aggregation)</li>
        <li><strong>JOINs:</strong> INNER, LEFT, RIGHT, SELF JOINs across primary/foreign keys</li>
        <li><strong>Set Operations:</strong> UNION (deduplicated) vs UNION ALL (retains all rows)</li>
        <li><strong>Conditional Logic:</strong> CASE WHEN ... THEN ... ELSE ... END</li>
        <li><strong>Subqueries:</strong> Nested queries for dynamic filtering</li>
        <li><strong>CTEs:</strong> <code>WITH</code> clauses for modular, readable query architecture</li>
        <li><strong>Window Functions:</strong> ROW_NUMBER(), RANK(), DENSE_RANK(), LAG(), LEAD(), and SUM() OVER(PARTITION BY...)</li>
      </ol>
    `
  },
  {
    title: "6-8. Python, NumPy & Pandas",
    content: `
      <p>You don't need to be a software engineer; you need Python for reproducible wrangling and analysis.</p>
      <ul>
        <li><strong>Python Basics:</strong> Data types (int, float, str, bool), structures (List, Dict, Tuple), control flow (if/else, for loops), and custom functions (<code>def</code>).</li>
        <li><strong>NumPy:</strong> Fixed-type arrays and vectorized arithmetic (<code>sales * 2</code>) that eliminate slow loops.</li>
        <li><strong>Pandas:</strong> The core analyst library. Loading data (<code>read_csv</code>), inspecting (<code>head</code>, <code>info</code>, <code>describe</code>), cleaning (<code>dropna</code>, <code>fillna</code>, <code>drop_duplicates</code>, <code>astype</code>), boolean filtering, grouping (<code>df.groupby().agg()</code>), and merging (<code>pd.merge()</code>, <code>pd.concat()</code>).</li>
      </ul>
    `
  },
  {
    title: "9-11. Visualizations, APIs & Databases from Python",
    content: `
      <p>Move beyond flat files to programmatic extraction and visualization.</p>
      <ul>
        <li><strong>Visualization:</strong> Matplotlib (foundational figure/axes), Seaborn (statistical distributions, heatmaps, box plots), and Plotly (interactive charts with hover details).</li>
        <li><strong>APIs:</strong> Using <code>requests</code> to call endpoints, parse JSON responses, and ingest them directly into Pandas DataFrames.</li>
        <li><strong>Databases from Python:</strong> Using <code>sqlite3</code> and <code>SQLAlchemy</code> to pull query outputs directly into Pandas DataFrames for automated analytical runs.</li>
      </ul>
    `
  },
  {
    title: "12-15. Power BI & DAX",
    content: `
      <p>Data preparation + modeling + dynamic calculations + reporting.</p>
      <ul>
        <li><strong>Power Query (ETL):</strong> Data type assignment, column cleaning, pivoting, and merging source feeds.</li>
        <li><strong>Data Modeling:</strong> Designing Star Schemas separating quantitative Fact tables (Sales, Orders) from lookup Dimension tables (Customers, Dates, SKUs) via 1-to-many relationships.</li>
        <li><strong>DAX:</strong> Measures vs calculated columns, Evaluation Context (Row vs Filter context), <code>CALCULATE()</code>, <code>FILTER()</code>, <code>SUMX()</code>, and Time Intelligence (YTD, MTD, YoY).</li>
        <li><strong>Visual Storytelling:</strong> Executive overview → Drill-down breakdown → Root cause exploration.</li>
        <li><strong>Service & Governance:</strong> Scheduled refresh, workspaces, Row-Level Security (RLS), and PL-300 prep.</li>
      </ul>
    `
  },
  {
    title: "16. Tableau",
    content: `
      <p>Learn once Power BI concepts are solid. Core concepts transfer smoothly:</p>
      <ul>
        <li><strong>Foundations:</strong> Worksheets, Marks card (Color, Size, Detail, Tooltip), Dimensions vs Measures.</li>
        <li><strong>Calculations:</strong> Calculated fields, table calculations (Running Total, % of Total).</li>
        <li><strong>LOD Expressions:</strong> <code>FIXED</code>, <code>INCLUDE</code>, and <code>EXCLUDE</code> to compute values at specific detail levels regardless of the sheet's display layout.</li>
        <li><strong>Dashboards:</strong> Containers, parameters, URL/filter actions, and Tableau Cloud deployment.</li>
      </ul>
    `
  },
  {
    title: "17-24. Business Analysis, Diagnostics & Data Quality",
    content: `
      <p>This is what separates a tool-operator from an indispensable Data Analyst.</p>
      <ul>
        <li><strong>The Why Chain:</strong> Follow metrics down from Profit ↓ → Margin ↓ → Discount Depth ↑ → Category Clearance → Low demand in Region X.</li>
        <li><strong>Symptom vs Cause vs Root Cause:</strong> Symptom = profit slipped; Cause = average discounts jumped; Root Cause = high promotional discounts were applied to negative-margin SKUs in one logistics hub.</li>
        <li><strong>Levels of Analysis:</strong> Descriptive (What happened?) → Diagnostic (Why did it happen?) → Prescriptive (What should we do?).</li>
        <li><strong>Data Validation Checks:</strong> Null/blank checks, primary key duplicates, type sanity, impossible values (negative quantities, 300% discounts), and category consolidation ('BLR' vs 'Bangalore').</li>
        <li><strong>Analytical Traps:</strong> Don't trust raw averages (segment first), and remember that Correlation ≠ Causation.</li>
        <li><strong>Actionable Recommendations:</strong> Frame every takeaway using: <em>Action → Owner → Metric → Timeframe</em>. Quantify the dollar impact clearly.</li>
      </ul>
    `
  }
];

const ANALYTIC_STEPS = [
  ["1. Understand the Business Problem", "Before opening any tool, clarify the business context: What decision is being made? What is the cost of inaction?"],
  ["2. Frame the Analytical Question", "Turn vague problem statements ('profit dropped') into quantifiable hypotheses ('why did gross margins contract 320 bps despite 18% sales growth?')."],
  ["3. 5W1H Diagnostics", "Ground the bounds of inquiry early: What, Why, Who, When, Where, and How Much."],
  ["4. Establish Baselines & Benchmarks", "Compare current metrics against targets, historical periods (YoY, MoM), and across parallel segments."],
  ["5. Spot Anomalies & Discrepancies", "Identify step-change drops, variance spikes, or divergences between correlated metrics (e.g. volumes climbing while net revenue declines)."],
  ["6. Segment Rather Than Averaging", "Aggregates conceal reality. Always slice the data by customer cohort, product line, channel, and geography."],
  ["7. Execute the 'Why?' Chain", "Trace the causal thread from symptom to operational driver. Stop only when arriving at an actionable business lever."],
  ["8. Separate Symptom from Root Cause", "Discounts rising is a symptom; discounting low-margin items to liquidate aged inventory is the underlying root cause."],
  ["9. Quantify Business Impact", "Avoid qualitative remarks. Say: 'High-discount orders generated ₹45L in revenue but ₹12L lower net profit compared to standard orders.'"],
  ["10. Prescribe Measurable Actions", "Deliver a concrete proposal: Action + Owner + Success Metric + Review Frequency."]
];

const QUIZ = [
  ["What is the fundamental difference between WHERE and HAVING in SQL?", "WHERE filters raw individual records before aggregation takes place. HAVING filters aggregated bucket groups after the GROUP BY clause runs."],
  ["Why use a LEFT JOIN instead of an INNER JOIN?", "A LEFT JOIN preserves every row from the left table even if there is no matching record in the right table (filling unmatched columns with NULL). It avoids silently dropping transaction data."],
  ["How does XLOOKUP in Excel conceptually connect to SQL and Pandas?", "XLOOKUP searches a key in a dataset and returns an associated attribute. This is conceptually identical to an indexed SQL LEFT JOIN and a Pandas pd.merge(..., how='left')."],
  ["Why does correlation not equal causation in business analytics?", "Two variables may move together due to a third confounding factor (e.g., promotional campaigns and seasonal holiday demand both boosting volume) or coincidence. Causal claims require controlled experimentation or isolated root-cause proof."],
  ["Interviewer asks: 'Profit dropped 12% last quarter — walk me through your diagnostic approach.'", "1) Validate data integrity & metric definitions; 2) Establish baseline vs prior quarters; 3) Segment across geography, product lines, and channels; 4) Pinpoint where the margin deterioration concentrates; 5) Trace the 'Why' chain to the operational root cause; 6) Quantify the financial impact; 7) Deliver an actionable recommendation with owner and success metric."],
  ["What is the difference between Row Context and Filter Context in DAX?", "Row Context means evaluating an expression row by row (e.g. in calculated columns or iterator functions like SUMX). Filter Context refers to the ambient filters active in the report (slicers, visual dimensions) defining which subset of data is evaluated."],
  ["What does a CTE (Common Table Expression) do, and why choose it over nested subqueries?", "A CTE creates a named temporary result set using the WITH keyword. It makes complex multi-stage calculations sequential, easy to read, and simpler to debug than deeply nested subqueries."],
  ["Why should an analyst never trust high-level averages blindly?", "Averages conceal underlying variance and can fall victim to Simpson's Paradox. An overall healthy average can hide a collapsing regional market offset by a temporary outlier in another."]
];

const PORTFOLIO_STEPS = [
  ["1. Business Problem", "Define the core operational challenge, stakeholder question, or revenue risk being explored."],
  ["2. Dataset Overview", "Source schema, transaction volumes, period coverage, and collection method."],
  ["3. Data Cleaning & Validation", "Document handling of missing data, deduplication, schema casting, and outlier resolution."],
  ["4. Key Performance Indicators (KPIs)", "Explicit definitions and formulas for Revenue, Margin %, AOV, Churn, and Retention."],
  ["5. Analytical Exploration", "Deep querying via SQL and Python/Pandas showing dimensional breakdowns and cohort behavior."],
  ["6. Interactive Visualization", "Power BI or Tableau dashboards illustrating high-level KPIs down to root-cause breakdowns."],
  ["7. Core Findings", "Concise, data-backed evidence showing where anomalies or drops concentrate."],
  ["8. Root Cause Identification", "Clear demonstration of the operational driver behind the performance numbers."],
  ["9. Quantified Business Impact", "Precise financial or unit quantification of the problem and potential upside."],
  ["10. Actionable Recommendations", "Concrete proposals structured with: Action → Owner → Metric → Timeframe."],
  ["11. Measurement & Review Plan", "How the business will track post-implementation success over subsequent review cycles."]
];

let activeTab = "roadmap";
let guideSearchTerm = "";
let guideCategoryFilter = "ALL";

const tabs = [
  ["roadmap", "🗺️ Full Roadmap"],
  ["guide", "📖 Complete Guide"],
  ...Object.keys(FLASHCARDS).map(k => [k, FLASHCARDS[k].label]),
  ["frameworks", "🧠 Diagnostics & Portfolio"],
  ["quiz", "🎯 Interview Prep"]
];

function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = tabs.map(([k, l]) =>
    `<button data-tab="${k}" class="${k === activeTab ? 'active' : ''}">${l}</button>`
  ).join('');

  nav.querySelectorAll('button').forEach(b => {
    b.onclick = () => {
      activeTab = b.dataset.tab;
      renderNav();
      renderMain();
    };
  });
}

function copyCode(btn, text){
  navigator.clipboard.writeText(text).then(() => {
    const orig = btn.innerText;
    btn.innerText = 'Copied!';
    setTimeout(() => { btn.innerText = orig; }, 1400);
  });
}

function escapeHtml(str){
  if(!str) return '';
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function escapeJsString(str){
  if(!str) return '';
  return str.replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\$/g, '\\$');
}

function renderGuide(){
  const parts = ["ALL", "Excel", "SQL", "Python", "NumPy", "Pandas", "Visualization", "APIs & Databases", "Power BI", "Tableau"];
  
  const filtered = GUIDE_DATA.filter(item => {
    const matchesPart = guideCategoryFilter === "ALL" || item.part.toLowerCase() === guideCategoryFilter.toLowerCase();
    const q = guideSearchTerm.toLowerCase();
    const matchesQuery = !q ||
      item.name.toLowerCase().includes(q) ||
      item.def.toLowerCase().includes(q) ||
      item.use.toLowerCase().includes(q) ||
      item.syntax.toLowerCase().includes(q) ||
      item.cat.toLowerCase().includes(q);
    return matchesPart && matchesQuery;
  });

  return `
    <h2>📖 Complete Reference Guide</h2>
    <p class="subhead">Definitions, syntax, and exact use cases across Excel, SQL, Python, Pandas, Power BI, DAX, and Tableau.</p>
    
    <div class="guide-controls">
      <input type="text" class="guide-search" id="guideSearch" placeholder="Search functions, syntax, or concepts (e.g. XLOOKUP, HAVING, .merge, CALCULATE)..." value="${escapeHtml(guideSearchTerm)}">
      <div class="guide-filter-pills">
        ${parts.map(p => `
          <button class="guide-pill ${guideCategoryFilter === p ? 'active' : ''}" data-part="${p}">${p}</button>
        `).join('')}
      </div>
    </div>

    <div class="guide-results">
      ${filtered.length === 0 ? `<p style="opacity:.7;padding:20px 0;">No matching entries found for "${escapeHtml(guideSearchTerm)}".</p>` : ''}
      ${filtered.map(item => `
        <div class="guide-entry">
          <h3>
            <span>${escapeHtml(item.name)}</span>
            <span class="category-badge">${escapeHtml(item.part)} ·${escapeHtml(item.cat)}</span>
          </h3>
          <div class="section-row"><strong>What it is:</strong> ${escapeHtml(item.def)}</div>
          <div class="section-row"><strong>Syntax / Pattern:</strong></div>
          <pre><code>${escapeHtml(item.syntax)}</code><button class="copy-btn" onclick="copyCode(this, \`${escapeJsString(item.syntax)}\`)">Copy</button></pre>
          <div class="section-row"><strong>When & Where to use:</strong> ${escapeHtml(item.use)}</div>
        </div>
      `).join('')}
    </div>
  `;
}

function attachGuideEvents(){
  const searchInput = document.getElementById('guideSearch');
  if(searchInput){
    searchInput.oninput = (e) => {
      guideSearchTerm = e.target.value;
      renderMain();
      const reInput = document.getElementById('guideSearch');
      if(reInput){
        reInput.focus();
        reInput.setSelectionRange(guideSearchTerm.length, guideSearchTerm.length);
      }
    };
  }

  document.querySelectorAll('.guide-pill').forEach(pill => {
    pill.onclick = () => {
      guideCategoryFilter = pill.dataset.part;
      renderMain();
    };
  });
}

function renderRoadmap(){
  return `
    <h2>🗺️ Complete Data Analyst Learning Progression</h2>
    <p class="subhead">A clear step-by-step roadmap from baseline analyst thinking to advanced BI tools.</p>
    
    <div class="flow-box">
      <h3 style="margin-top:0;color:var(--denim);">The Skill Stack Architecture</h3>
      <div class="flow-diagram">
        <div class="flow-node">Business Mindset & Problem Framing</div>
        <div class="flow-arrow">↓</div>
        <div class="flow-node">Excel (Formulas, XLOOKUP, Pivot Tables)</div>
        <div class="flow-arrow">↓</div>
        <div class="flow-node">SQL (SELECT to Window Functions & CTEs)</div>
        <div class="flow-arrow">↓</div>
        <div class="flow-node">Python Fundamentals</div>
        <div class="flow-arrow">↓</div>
        <div class="flow-node">NumPy & Pandas (Wrangling & Cleaning)</div>
        <div class="flow-arrow">↓</div>
        <div class="flow-node">Data Visualization (Matplotlib, Seaborn, Plotly)</div>
        <div class="flow-arrow">↓</div>
        <div class="flow-node">APIs & SQL-to-Python Workflows</div>
        <div class="flow-arrow">↓</div>
        <div class="flow-node">Power BI (Power Query, Star Schema, DAX)</div>
        <div class="flow-arrow">↓</div>
        <div class="flow-node">Tableau (LOD, Calculated Fields, Dashboards)</div>
        <div class="flow-arrow">↓</div>
        <div class="flow-node">Diagnostic Business Storytelling & Impact</div>
      </div>
    </div>

    <div class="steps">
      ${ROADMAP_SECTIONS.map(s => `
        <div class="step">
          <b>${s.title}</b>
          <div>${s.content}</div>
        </div>
      `).join('')}
    </div>

    <div class="flow-box" style="margin-top:24px;">
      <h3 style="margin-top:0;color:var(--denim);">Learning Priority Tiers</h3>
      <table class="road-table">
        <tr><th>Tier</th><th>Skills & Tools</th><th>Strategy</th></tr>
        <tr>
          <td><strong>Tier 1 — Must Master</strong></td>
          <td>Excel (XLOOKUP, SUMIFS, Pivots), SQL (CTEs, Joins, Group By, Window Funcs), Python/Pandas, Power BI (Star Schema, CALCULATE, Measures), Business Analysis Frameworks.</td>
          <td>80% of daily analyst work. Focus practice here until second nature.</td>
        </tr>
        <tr>
          <td><strong>Tier 2 — Important</strong></td>
          <td>APIs (requests), SQLAlchemy, Plotly, Advanced DAX, Tableau (LOD expressions), Power BI Service & Governance.</td>
          <td>Learn after foundational tools are fluent to expand versatility.</td>
        </tr>
        <tr>
          <td><strong>Tier 3 — As Needed</strong></td>
          <td>Advanced NumPy, Fabric, Copilot capabilities, complex spatial analytics, database administration.</td>
          <td>Don't stall progress for these; learn on the job when required.</td>
        </tr>
      </table>
    </div>
  `;
}

function renderFrameworks(){
  return `
    <h2>🧠 Diagnostic Frameworks & Project Architecture</h2>
    <p class="subhead">The operational frameworks that separate junior tool users from strategic business analysts.</p>

    <div class="flow-box">
      <h3 style="margin-top:0;color:var(--denim);">The 10-Step Problem Diagnostic Checklist</h3>
      <div class="steps">
        ${ANALYTIC_STEPS.map(([t, d]) => `
          <div class="step">
            <b>${escapeHtml(t)}</b>
            <div>${escapeHtml(d)}</div>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="flow-box" style="margin-top:20px;">
      <h3 style="margin-top:0;color:var(--denim);">Structuring Job-Ready Portfolio Projects</h3>
      <p style="font-size:.85rem;line-height:1.45;">Every project in your portfolio should be structured as an investigation that drove a decision, not just a technical showcase of code:</p>
      <div class="steps">
        ${PORTFOLIO_STEPS.map(([t, d]) => `
          <div class="step" style="border-left-color:var(--accent2);">
            <b>${escapeHtml(t)}</b>
            <div>${escapeHtml(d)}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function renderMain(){
  const main = document.getElementById('main');

  if(activeTab === 'roadmap'){
    main.innerHTML = renderRoadmap();
  } else if(activeTab === 'guide'){
    main.innerHTML = renderGuide();
    attachGuideEvents();
  } else if(FLASHCARDS[activeTab]){
    const d = FLASHCARDS[activeTab];
    main.innerHTML = `
      <h2>${d.label} Flashcards</h2>
      <p class="subhead">Tap any card to flip between syntax patterns and applied concepts.</p>
      <div class="grid">
        ${d.cards.map((c, i) => `
          <div class="card" data-i="${i}">
            <div class="front">
              ${escapeHtml(c.t)}
              <small>tap to flip ↴</small>
            </div>
            <div class="back">
              <span class="tag">${escapeHtml(c.t)}</span>${escapeHtml(c.d)}
            </div>
            <div class="hint">↺ flip</div>
          </div>
        `).join('')}
      </div>
    `;
    main.querySelectorAll('.card').forEach(el => el.onclick = () => el.classList.toggle('flipped'));
  } else if(activeTab === 'frameworks'){
    main.innerHTML = renderFrameworks();
  } else if(activeTab === 'quiz'){
    main.innerHTML = `
      <h2>🎯 Interview Diagnostic Prep</h2>
      <p class="subhead">Practice answering these conceptual and scenario-based interview questions.</p>
      ${QUIZ.map(([q, a], i) => `
        <div class="quiz-card">
          <p class="q">Q${i + 1}.${escapeHtml(q)}</p>
          <button class="reveal" data-i="${i}">Reveal Answer</button>
          <div class="ans" id="ans${i}">${escapeHtml(a)}</div>
        </div>
      `).join('')}
    `;
    main.querySelectorAll('.reveal').forEach(b => {
      b.onclick = () => {
        const target = document.getElementById('ans' + b.dataset.i);
        const isOpen = target.style.display === 'block';
        target.style.display = isOpen ? 'none' : 'block';
        b.innerText = isOpen ? 'Reveal Answer' : 'Hide Answer';
      };
    });
  }
}

renderNav();
renderMain();
</script>
</body>
