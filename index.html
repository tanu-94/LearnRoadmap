<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LearnRoadmap — Data Analyst Study Hub</title>
<style>
:root{
  --cream:#f7f1e6; --cream2:#efe6d4; --denim:#2f4a63; --denim2:#3d5f7d;
  --ink:#26313a; --accent:#d97b3f; --accent2:#6a8a5f; --card:#fffaf0; --border:#d9cdb3;
  --code-bg:#232b32; --code-text:#e6edf3;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --cream:#1c2128; --cream2:#242b33; --ink:#eee6d3; --card:#232a32; --border:#3a4653; --denim:#7fa5c4; --code-bg:#151b23; --code-text:#f0f6fc;
  }
}
:root[data-theme="dark"]{
  --cream:#1c2128; --cream2:#242b33; --ink:#eee6d3; --card:#232a32; --border:#3a4653; --denim:#7fa5c4; --code-bg:#151b23; --code-text:#f0f6fc;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Courier New',ui-monospace,monospace;min-height:100%;}
header{background:var(--denim);color:#fdf6e8;padding:22px 16px calc(18px + env(safe-area-inset-top,0px));text-align:center;}
header h1{margin:0 0 6px;font-size:1.6rem;}
header p{margin:0;opacity:.9;font-size:.88rem;max-width:650px;margin:0 auto;}
nav{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:12px;background:var(--cream2);position:sticky;top:0;z-index:10;border-bottom:2px solid var(--border);}
nav button{font-family:inherit;font-size:.8rem;padding:8px 13px;border-radius:20px;border:2px solid var(--border);background:var(--card);color:var(--ink);cursor:pointer;transition:all .15s ease;}
nav button:hover{border-color:var(--accent);}
nav button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
main{max-width:960px;margin:0 auto;padding:22px 16px 60px;}
h2{color:var(--denim);border-bottom:3px solid var(--accent);display:inline-block;padding-bottom:3px;margin-top:0;}
p.subhead{font-size:.86rem;opacity:.85;margin-top:4px;margin-bottom:18px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:14px;}
.card{background:var(--card);border:2px solid var(--border);border-radius:10px;min-height:140px;padding:14px;cursor:pointer;position:relative;display:flex;flex-direction:column;justify-content:space-between;transition:transform .12s ease, box-shadow .12s ease;}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,0.06);}
.card .front{font-weight:bold;color:var(--denim);font-size:.95rem;}
.card .front small{display:block;font-weight:normal;color:var(--ink);opacity:.7;margin-top:8px;font-size:.75rem;}
.card .back{display:none;font-size:.8rem;line-height:1.45;white-space:pre-wrap;}
.card.flipped .front{display:none;}
.card.flipped .back{display:block;}
.card .tag{display:inline-block;background:var(--accent2);color:#fff;font-size:.65rem;padding:2px 8px;border-radius:10px;margin-bottom:8px;}
.hint{font-size:.7rem;opacity:.6;align-self:flex-end;margin-top:10px;}
.steps{margin-top:14px;}
.step{background:var(--card);border-left:5px solid var(--accent);border-radius:6px;padding:14px;margin-bottom:12px;}
.step b{color:var(--denim);font-size:.95rem;}
.step div{margin-top:4px;font-size:.85rem;line-height:1.45;}
.quiz-card{background:var(--card);border:2px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px;}
.quiz-card p.q{font-weight:bold;color:var(--denim);margin-top:0;font-size:.92rem;}
.quiz-card .ans{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);font-size:.85rem;line-height:1.45;}
.quiz-card button.reveal{font-family:inherit;background:var(--accent);color:#fff;border:none;border-radius:20px;padding:6px 14px;cursor:pointer;font-size:.8rem;}
.guide-controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;align-items:center;}
.guide-search{flex:1;min-width:240px;padding:9px 14px;border:2px solid var(--border);border-radius:8px;font-family:inherit;font-size:.85rem;background:var(--card);color:var(--ink);}
.guide-search:focus{outline:none;border-color:var(--accent);}
.guide-filter-pills{display:flex;flex-wrap:wrap;gap:6px;}
.guide-pill{font-family:inherit;font-size:.75rem;padding:5px 10px;border-radius:14px;border:1px solid var(--border);background:var(--card);color:var(--ink);cursor:pointer;}
.guide-pill.active{background:var(--denim2);color:#fff;border-color:var(--denim2);}
.guide-entry{background:var(--card);border:2px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px;}
.guide-entry h3{margin:0 0 6px;color:var(--denim);font-size:1.05rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;}
.guide-entry .category-badge{font-size:.65rem;background:var(--accent2);color:#fff;padding:2px 8px;border-radius:10px;font-weight:normal;}
.guide-entry .section-row{margin:6px 0;font-size:.84rem;line-height:1.45;}
.guide-entry .section-row strong{color:var(--denim2);}
.guide-entry pre{background:var(--code-bg);color:var(--code-text);padding:10px 12px;border-radius:6px;font-size:.8rem;overflow-x:auto;position:relative;margin:8px 0;}
.guide-entry code{font-family:'Courier New',ui-monospace,monospace;}
.copy-btn{position:absolute;top:6px;right:6px;background:rgba(255,255,255,0.2);border:none;border-radius:4px;color:#fff;font-size:.7rem;padding:3px 7px;cursor:pointer;}
.copy-btn:hover{background:rgba(255,255,255,0.4);}
footer{text-align:center;padding:20px;font-size:.75rem;opacity:.65;}
</style>
</head>
<body>
<header>
  <h1>📊 LearnRoadmap</h1>
  <p>Data Analyst study hub — interactive cards, complete reference handbook, analytical frameworks, and interview prep.</p>
</header>

const FLASHCARDS = {

      {t:"GROUP BY + HAVING", d:"Aggregate per group, then filter groups.\nSELECT region, SUM(sales) FROM orders GROUP BY region HAVING SUM(sales) > 1e5;\nUse: 'total by category', keeping only qualifying groups."},
      {t:"JOINs", d:"INNER = only matches. LEFT = keep all from left table.\nFROM orders o LEFT JOIN customers c ON o.cid=c.cid;\nUse: Combine related tables while preventing silent record drops."},
      {t:"CASE WHEN", d:"If/else conditional classification inside SQL.\nCASE WHEN profit < 0 THEN 'Loss' ELSE 'Profit' END\nUse: Bucketing numbers into readable analytical categories."},
      {t:"Window Functions", d:"ROW_NUMBER(), RANK(), LAG() OVER(PARTITION BY... ORDER BY...)\nUse: Rank items inside groups, running totals, and period-over-period deltas without row collapse."},
      {t:"CTE (WITH)", d:"WITH x AS (SELECT ...) SELECT * FROM x;\nUse: Break complex queries into readable, sequential building blocks."}
    ]
  },
  python: {
    label: "🐍 Python / Pandas",
    cards: [
      {t:"List / Dict / Tuple", d:"List=[1,2] (mutable)\nDict={'a':1} (key-value)\nTuple=(1,2) (immutable)\nUse: Dict for individual records, List for homogeneous sequences."},
      {t:"df.groupby()", d:"df.groupby('region')['sales'].sum()\nPandas equivalent of SQL GROUP BY. Use for dimensional breakdowns."},
      {t:".merge()", d:"pd.merge(a, b, on='id', how='left')\nPandas JOIN. Supports 'inner', 'left', 'right', and 'outer'."},
      {t:"Boolean Masking", d:"df[(df.sales > 1000) & (df.region == 'South')]\nUse & (AND) and | (OR) — never the words 'and'/'or'."},
      {t:"dropna / fillna", d:"df.dropna() removes rows with nulls.\ndf.fillna(0) substitutes missing values.\nUse: Clean missing data prior to calculations."},
      {t:"List Comprehension", d:"[x * 2 for x in nums if x > 0]\nCompact, readable single-line transformation for lists."}
    ]
  },
  excel: {
    label: "📗 Excel",
    cards: [
      {t:"XLOOKUP", d:"=XLOOKUP(id, id_range, name_range)\nRetrieves matching records without column index dependencies. The modern replacement for VLOOKUP."},
      {t:"SUMIFS / COUNTIFS", d:"=SUMIFS(Sales, Region, 'South', Product, 'Laptop')\nAggregate values across multiple criteria simultaneously."},
      {t:"Pivot Tables", d:"Insert > PivotTable. Drag fields to Rows/Columns/Values.\nUse: Rapid, zero-formula dimensional cross-tabulations."},
      {t:"IF() Logic", d:"=IF(B2>1000, 'High', 'Low')\nSingle-cell conditional categorization."},
      {t:"Ctrl + T (Tables)", d:"Converts range into a structured table.\nUse: Guarantees downstream formulas and Pivot Tables expand with new rows."}
    ]
  },
  powerbi: {
    label: "📈 Power BI / DAX",
    cards: [
      {t:"DAX Measure", d:"Total Sales = SUM(Sales[Sales])\nDynamically calculated under current filter context. Reusable across all report visuals."},
      {t:"CALCULATE()", d:"CALCULATE([Total Sales], Region[Region]='South')\nModifies/overrides filter context. DAX's core engine."},
      {t:"Star Schema", d:"Central Fact table connected to surrounding Dimension lookup tables.\nUse: Essential for model performance, clean filters, and calculation speed."},
      {t:"Time Intelligence", d:"TOTALYTD([Total Sales], 'Date'[Date])\nSAMEPERIODLASTYEAR(...)\nUse: Track YTD and YoY performance against a dedicated Date table."}
    ]
  }
};

const ANALYZE_STEPS = [
  ["1. Understand the Business Problem", "Before opening any tool — clarify what the business wants to improve, what decision hinges on this analysis, and what the financial cost of inaction is."],
  ["2. Frame the Precise Question", "Transform vague requests ('profit is down') into quantifiable, testable hypotheses ('why did net margin drop 320 bps in Q3 despite top-line revenue rising 8%?')."],
  ["3. Run the 5W1H Diagnostic", "Identify What, Why, Who, When, Where, and How Much before writing queries. Ground the bounds of the investigation early."],
  ["4. Establish Baselines & Benchmarks", "Revenue → Margin → Volumes → Customer Churn. Always compare current performance to prior year (YoY), prior period (MoM), and internal targets."],
  ["5. Spot Anomalies & Outliers", "Look for sudden step-changes, spikes, distribution bi-modality, or divergence between related metrics (e.g. volume rising while gross revenue falls)."],
  ["6. Segment Rather Than Averaging", "Simpson's Paradox and aggregated averages hide truth. Break performance down across geography, customer tier, product SKU, and sales channel."],
  ["7. Execute the '5 Whys' Chain", "Margin dropped → Why? Higher discount depth → Why? Clearance in Category B → Why? Inventory overstock from delayed supply. Stop only when reaching an actionable lever."],
  ["8. Distinguish Symptom from Root Cause", "Symptom: Net revenue slipped in Q2. Direct cause: Customer order frequency dipped. Root cause: Delivery delays from a newly onboarded carrier in the southern hub."],
  ["9. Quantify the Business Impact", "Never say 'discounts hurt profit.' State: 'Uncapped promotional discounts on SKU family X reduced gross margin by ₹42L across 1,800 transactions.'"],
  ["10. Formulate Actionable Recommendations", "Never recommend 'improve sales.' Provide a concrete initiative: 'Cap regional promotional discounts at 15% on products with gross margin under 25%, assign ownership to Regional Ops, and track margin weekly.'"]
];

const QUIZ = [
  ["What is the fundamental difference between WHERE and HAVING?", "WHERE filters raw individual records BEFORE any aggregation takes place. HAVING filters aggregated bucket groups AFTER the GROUP BY clause runs."],
  ["Why use a LEFT JOIN instead of an INNER JOIN?", "A LEFT JOIN preserves every single record from the left table even if no match exists on the right (yielding NULLs). It prevents silent data loss when related metadata might be missing."],
  ["What does df.groupby('region')['sales'].sum() execute in Pandas?", "It splits the DataFrame into distinct subsets based on unique 'region' values, isolates the 'sales' series in each group, computes the sum, and returns a grouped Series."],
  ["Why does correlation not imply causation?", "Two metrics can move together because both respond to a third latent variable (confounder) or random co-occurrence. Rigorous root-cause isolation or A/B testing is required to verify causality."],
  ["An interviewer asks: 'Profit dropped 12% last quarter — walk me through your diagnostic approach.'", "State: 1) Clarify metric definition and data integrity; 2) Establish baseline vs prior periods; 3) Segment by geography, product line, and customer cohort; 4) Pinpoint where the drop concentrates; 5) Trace the 'Why' chain to the underlying operational cause; 6) Quantify the dollar impact; 7) Deliver a concrete, owner-assigned recommendation."],
  ["What is a Common Table Expression (CTE) and why prefer it over deeply nested subqueries?", "A CTE (WITH query_name AS (...)) builds a temporary, named result set. It makes complex queries modular, sequential, and far easier to debug and optimize compared to nested subqueries."],
  ["In DAX, what does CALCULATE() actually do under the hood?", "It modifies or replaces the current filter context under which an expression is evaluated, enabling targeted segment computations regardless of ambient report slicers."],
  ["Why must an analyst segment data before trusting an aggregated average?", "A high-level average can mask severe negative trends within specific cohorts, or be distorted by small groups of massive outliers (e.g., an average transaction size looking healthy while 70% of accounts are declining)."]
];

let activeTab = "guide";
let guideSearchTerm = "";
let guideCategoryFilter = "ALL";

const tabs = [
  ["guide", "📖 Complete Guide"],
  ...Object.keys(FLASHCARDS).map(k => [k, FLASHCARDS[k].label]),
  ["analyze", "🧠 How to Analyze"],
  ["quiz", "🎯 Interview Prep"]
];

function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = tabs.map(([k, l]) =>
    `<button data-tab="${k}" class="${k === activeTab ? 'active' : ''}">${l}</button>`
  ).join('');

  nav.querySelectorAll('button').forEach(b => {
    b.onclick = () => {
      activeTab = b.dataset.tab;
      renderNav();
      renderMain();
    };
  });
}

function copyCode(btn, text){
  navigator.clipboard.writeText(text).then(() => {
    const orig = btn.innerText;
    btn.innerText = 'Copied!';
    setTimeout(() => { btn.innerText = orig; }, 1400);
  });
}

function renderGuide(){
  const parts = ["ALL", "SQL", "Python", "NumPy", "Pandas", "Visualization", "Excel", "Power BI"];
  
  const filtered = GUIDE_DATA.filter(item => {
    const matchesPart = guideCategoryFilter === "ALL" || item.part.toLowerCase() === guideCategoryFilter.toLowerCase();
    const q = guideSearchTerm.toLowerCase();
    const matchesQuery = !q ||
      item.name.toLowerCase().includes(q) ||
      item.def.toLowerCase().includes(q) ||
      item.use.toLowerCase().includes(q) ||
      item.syntax.toLowerCase().includes(q) ||
      item.cat.toLowerCase().includes(q);
    return matchesPart && matchesQuery;
  });

  return `
    <h2>📖 Complete Analyst Reference Guide</h2>
    <p class="subhead">Definitions, syntax, and exact use cases across SQL, Python, Pandas, Excel, and Power BI/DAX.</p>
    
    <div class="guide-controls">
      <input type="text" class="guide-search" id="guideSearch" placeholder="Search functions, syntax, or keywords (e.g., HAVING, XLOOKUP, .merge)..." value="${escapeHtml(guideSearchTerm)}">
      <div class="guide-filter-pills">
        ${parts.map(p => `
          <button class="guide-pill ${guideCategoryFilter === p ? 'active' : ''}" data-part="${p}">${p}</button>
        `).join('')}
      </div>
    </div>

    <div class="guide-results">
      ${filtered.length === 0 ? `<p style="opacity:.7;padding:20px 0;">No matching entries found for "${escapeHtml(guideSearchTerm)}".</p>` : ''}
      ${filtered.map((item, idx) => `
        <div class="guide-entry">
          <h3>
            <span>${escapeHtml(item.name)}</span>
            <span class="category-badge">${escapeHtml(item.part)} ·${escapeHtml(item.cat)}</span>
          </h3>
          <div class="section-row"><strong>What it is:</strong> ${escapeHtml(item.def)}</div>
          <div class="section-row"><strong>Syntax / Pattern:</strong></div>
          <pre><code>${escapeHtml(item.syntax)}</code><button class="copy-btn" onclick="copyCode(this, \`${escapeJsString(item.syntax)}\`)">Copy</button></pre>
          <div class="section-row"><strong>When & Where to use:</strong> ${escapeHtml(item.use)}</div>
        </div>
      `).join('')}
    </div>
  `;
}

function escapeHtml(str){
  if(!str) return '';
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function escapeJsString(str){
  if(!str) return '';
  return str.replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\$/g, '\\$');
}

function attachGuideEvents(){
  const searchInput = document.getElementById('guideSearch');
  if(searchInput){
    searchInput.oninput = (e) => {
      guideSearchTerm = e.target.value;
      const resContainer = document.querySelector('.guide-results');
      if(resContainer){
        renderMain();
        const reInput = document.getElementById('guideSearch');
        if(reInput){
          reInput.focus();
          reInput.setSelectionRange(guideSearchTerm.length, guideSearchTerm.length);
        }
      }
    };
  }

  document.querySelectorAll('.guide-pill').forEach(pill => {
    pill.onclick = () => {
      guideCategoryFilter = pill.dataset.part;
      renderMain();
    };
  });
}

function renderMain(){
  const main = document.getElementById('main');

  if(activeTab === 'guide'){
    main.innerHTML = renderGuide();
    attachGuideEvents();
  } else if(FLASHCARDS[activeTab]){
    const d = FLASHCARDS[activeTab];
    main.innerHTML = `
      <h2>${d.label} Flashcards</h2>
      <p class="subhead">Click any card to flip between concepts and application snippets.</p>
      <div class="grid">
        ${d.cards.map((c, i) => `
          <div class="card" data-i="${i}">
            <div class="front">
              ${escapeHtml(c.t)}
              <small>tap to flip ↴</small>
            </div>
            <div class="back">
              <span class="tag">${escapeHtml(c.t)}</span>${escapeHtml(c.d)}
            </div>
            <div class="hint">↺ flip</div>
          </div>
        `).join('')}
      </div>
    `;
    main.querySelectorAll('.card').forEach(el => el.onclick = () => el.classList.toggle('flipped'));
  } else if(activeTab === 'analyze'){
    main.innerHTML = `
      <h2>🧠 How to Analyze (Mental Frameworks)</h2>
      <p class="subhead">How strong analysts decompose messy business problems during technical interviews and on the job.</p>
      <div class="steps">
        ${ANALYZE_STEPS.map(([t, d]) => `
          <div class="step">
            <b>${escapeHtml(t)}</b>
            <div>${escapeHtml(d)}</div>
          </div>
        `).join('')}
      </div>
    `;
  } else if(activeTab === 'quiz'){
    main.innerHTML = `
      <h2>🎯 Interview Diagnostic Prep</h2>
      <p class="subhead">Practice answering these high-frequency verbal scenario questions before clicking reveal.</p>
      ${QUIZ.map(([q, a], i) => `
        <div class="quiz-card">
          <p class="q">Q${i + 1}.${escapeHtml(q)}</p>
          <button class="reveal" data-i="${i}">Reveal Answer</button>
          <div class="ans" id="ans${i}">${escapeHtml(a)}</div>
        </div>
      `).join('')}
    `;
    main.querySelectorAll('.reveal').forEach(b => {
      b.onclick = () => {
        const target = document.getElementById('ans' + b.dataset.i);
        const isOpen = target.style.display === 'block';
        target.style.display = isOpen ? 'none' : 'block';
        b.innerText = isOpen ? 'Reveal Answer' : 'Hide Answer';
      };
    });
  }
}

renderNav();
renderMain();
</script>
</body>
</html>
