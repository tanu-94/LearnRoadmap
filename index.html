<!DOCTYPE html>

<head>

  <title>LearnRoadmap</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap');
    body { font-family: 'Inter', sans-serif; }
    pre, code { font-family: 'Fira Code', monospace; }
    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 flex h-screen overflow-hidden">

  <!-- SIDEBAR NAVIGATION -->
  <aside class="w-80 bg-slate-900 text-slate-300 flex flex-col flex-shrink-0 border-r border-slate-800">
    <div class="p-5 border-b border-slate-800 flex items-center justify-between">
      <div>
        <div class="flex items-center gap-2 text-sky-400 font-bold text-lg">
          <i data-lucide="database" class="w-5 h-5"></i>
          <span>Data Analyst Portal</span>
        </div>
        <p class="text-xs text-slate-400 mt-1">Unified Hospital Case Study</p>
      </div>
    </div>

    <!-- Search Box -->
    <div class="px-4 py-3 border-b border-slate-800">
      <div class="relative">
        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-slate-500"></i>
        <input type="text" id="searchInput" placeholder="Search topic or function..." 
          class="w-full bg-slate-800 text-slate-200 text-sm rounded-lg pl-9 pr-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-500">
      </div>
    </div>

    <!-- Lesson Menu List -->
    <nav class="flex-1 overflow-y-auto custom-scroll p-4 space-y-6" id="sidebarNav">
      <!-- Populated dynamically by JavaScript -->
    </nav>

    <!-- Instructor Cue Toggle (For Anxiety / Stage Fear) -->
    <div class="p-4 border-t border-slate-800 bg-slate-950">
      <label class="flex items-center justify-between cursor-pointer">
        <span class="text-xs font-semibold text-slate-300 flex items-center gap-1.5">
          <i data-lucide="mic" class="w-4 h-4 text-amber-400"></i> Instructor Cue Mode
        </span>
        <input type="checkbox" id="cueModeToggle" class="sr-only">
        <div class="w-9 h-5 bg-slate-700 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-amber-500 relative"></div>
      </label>
      <p class="text-[11px] text-slate-500 mt-1">Shows simple speaking lines & classroom explanations.</p>
    </div>
  </aside>

  <!-- MAIN CONTENT AREA -->
  <main class="flex-1 flex flex-col h-full overflow-hidden bg-white">
    <!-- Top Header -->
    <header class="h-16 border-b border-slate-200 px-8 flex items-center justify-between bg-white flex-shrink-0">
      <div class="flex items-center gap-2 text-sm text-slate-500">
        <span id="breadcrumbModule" class="font-medium text-slate-700">Module</span>
        <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
        <span id="breadcrumbTitle" class="text-sky-600 font-medium">Topic Title</span>
      </div>
      <div class="flex items-center gap-3">
        <span id="pageProgress" class="text-xs text-slate-400 font-medium">Page 1 of 18</span>
      </div>
    </header>

    <!-- Scrollable Lesson Body -->
    <div class="flex-1 overflow-y-auto p-8 custom-scroll bg-slate-50" id="contentContainer">
      <div class="max-w-4xl mx-auto space-y-6" id="lessonContent">
        <!-- Rendered by JavaScript -->
      </div>
    </div>

    <!-- Bottom Continuous Pagination -->
    <footer class="h-20 border-t border-slate-200 px-8 flex items-center justify-between bg-white flex-shrink-0">
      <button id="prevBtn" class="flex items-center gap-2 px-5 py-2.5 rounded-lg border border-slate-300 text-slate-700 font-medium text-sm hover:bg-slate-50 transition-all disabled:opacity-30 disabled:cursor-not-allowed">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        <span>Previous Topic</span>
      </button>

      <div class="text-center hidden sm:block">
        <p class="text-xs text-slate-400">Use arrow keys (← / →) or click to advance</p>
      </div>

      <button id="nextBtn" class="flex items-center gap-2 px-5 py-2.5 rounded-lg bg-sky-600 text-white font-medium text-sm hover:bg-sky-700 shadow-sm transition-all disabled:opacity-30 disabled:cursor-not-allowed">
        <span>Next Topic</span>
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
    </footer>
  </main>

  <!-- JAVASCRIPT DATA & LOGIC -->
  <script>
    const curriculum = [
      // MODULE 0: BUSINESS FIRST
      {
        id: "biz-01",
        module: "Module 0: Business Analytics",
        title: "01. Business Problem & 5W1H Framework",
        badge: "Business First",
        definition: "Before touching Excel, SQL, or Python, an analyst must translate vague business complaints into a measurable, investigative question.",
        instructorCue: "Say this to class: 'Never open SQL Workbench first. If management says staffing costs are high, ask who, when, and where. Our job is answering business questions, not just writing code.'",
        concept: `
          <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4">
            <h3 class="font-bold text-slate-900 text-base flex items-center gap-2">
              <i data-lucide="help-circle" class="w-5 h-5 text-sky-500"></i> The 5W1H Questioning Method
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
              <div class="p-3 bg-slate-50 rounded-lg border border-slate-100">
                <span class="font-semibold text-slate-700">What?</span>
                <p class="text-slate-600 mt-1">What exactly is happening? (Emergency staffing costs are exceeding monthly budgets).</p>
              </div>
              <div class="p-3 bg-slate-50 rounded-lg border border-slate-100">
                <span class="font-semibold text-slate-700">Why?</span>
                <p class="text-slate-600 mt-1">Why is it happening? (Senior doctors are scheduled for long 12-hour night shifts).</p>
              </div>
              <div class="p-3 bg-slate-50 rounded-lg border border-slate-100">
                <span class="font-semibold text-slate-700">Who?</span>
                <p class="text-slate-600 mt-1">Who is affected? (Doctors Ravi and Kiran, while Sara remains unassigned).</p>
              </div>
              <div class="p-3 bg-slate-50 rounded-lg border border-slate-100">
                <span class="font-semibold text-slate-700">When?</span>
                <p class="text-slate-600 mt-1">When did it begin? (September 2026 shift scheduling cycle).</p>
              </div>
              <div class="p-3 bg-slate-50 rounded-lg border border-slate-100">
                <span class="font-semibold text-slate-700">Where?</span>
                <p class="text-slate-600 mt-1">Where is the issue localized? (Emergency department versus Nursing and Pharmacy).</p>

              <div class="p-3 bg-slate-50 rounded-lg border border-slate-100">

              <li class="flex items-start gap-2"><strong class="text-slate-800 min-w-32">3. Prescriptive:</strong> "What should we do?" → Assign nurses to night shifts and fill Sara's department.</li>
            </ul>
          </div>
        `
      },
      {
        id: "biz-02",
        module: "Module 0: Business Analytics",
        title: "02. The 10 Golden Rules for Analysts",
        badge: "Mindset",
        definition: "Core principles that protect you from delivering misleading metrics or solving the wrong problem.",
        instructorCue: "Tell them: 'Rule 4 is huge. If you take the average salary of the hospital, you get ₹49,857. But 5 out of 7 staff earn under ₹40,000! Two doctors skew the average. Never trust averages alone.'",
        concept: `
          <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
              <div class="p-3 border-l-4 border-sky-500 bg-slate-50">
                <p class="font-bold text-slate-800">1. Business question first, data second</p>
                <p class="text-slate-600 mt-0.5">Never write random queries without a defined goal.</p>
              </div>
              <div class="p-3 border-l-4 border-sky-500 bg-slate-50">
                <p class="font-bold text-slate-800">2. Correlation ≠ Causation</p>
                <p class="text-slate-600 mt-0.5">Two things moving together does not mean one caused the other.</p>
              </div>
              <div class="p-3 border-l-4 border-sky-500 bg-slate-50">
                <p class="font-bold text-slate-800">3. Always validate the data</p>
                <p class="text-slate-600 mt-0.5">Check for NULLs, duplicates, and impossible dates first.</p>
              </div>
              <div class="p-3 border-l-4 border-sky-500 bg-slate-50">
                <p class="font-bold text-slate-800">4. Don't trust averages alone</p>
                <p class="text-slate-600 mt-0.5">Outliers pull the mean up; always compare mean vs median.</p>
              </div>
              <div class="p-3 border-l-4 border-sky-500 bg-slate-50">
                <p class="font-bold text-slate-800">5. Segment before concluding</p>
                <p class="text-slate-600 mt-0.5">Slice numbers by department, role, and shift type.</p>
              </div>
              <div class="p-3 border-l-4 border-sky-500 bg-slate-50">
                <p class="font-bold text-slate-800">6. Quantify the exact impact</p>
                <p class="text-slate-600 mt-0.5">Give rupees or hours, not vague words like 'a lot'.</p>
              </div>
              <div class="p-3 border-l-4 border-sky-500 bg-slate-50">
                <p class="font-bold text-slate-800">7. Root cause, not biggest number</p>
                <p class="text-slate-600 mt-0.5">The largest department isn't always the broken one.</p>
              </div>
              <div class="p-3 border-l-4 border-sky-500 bg-slate-50">
                <p class="font-bold text-slate-800">8. Recommendations must be actionable</p>
                <p class="text-slate-600 mt-0.5">Tell stakeholders exact steps, not generic advice.</p>
              </div>
              <div class="p-3 border-l-4 border-sky-500 bg-slate-50">
                <p class="font-bold text-slate-800">9. Pass the "So What?" test</p>
                <p class="text-slate-600 mt-0.5">If a chart doesn't help make a decision, delete it.</p>
              </div>
              <div class="p-3 border-l-4 border-sky-500 bg-slate-50">
                <p class="font-bold text-slate-800">10. Tell a complete story</p>
                <p class="text-slate-600 mt-0.5">Problem → Evidence → Root Cause → Solution.</p>
              </div>
            </div>
          </div>
        `

      {
        id: "sql-02",
        module: "Module 1: MySQL Mastery",
        title: "04. Basic Querying & Filtering (SELECT & WHERE)",

        definition: "Reading specific columns and filtering records with comparison and logical operators.",
        instructorCue: "Remind students: 'Never write dept_id = NULL. In SQL, NULL means missing, so you must always write IS NULL.'",
        code: `-- 1. Find all staff earning more than 35,000

        id: "sql-03",
        module: "Module 1: MySQL Mastery",
        title: "05. Aggregations & Grouping (GROUP BY & HAVING)",
        badge: "Summarizing",
        definition: "GROUP BY summarizes rows into categories. HAVING filters aggregated numbers (WHERE cannot filter aggregates).",
        instructorCue: "Write on the board: 'WHERE filters rows before grouping. HAVING filters groups after grouping.' This is the #1 interview question.",
        code: `-- 1. Staff count and average salary by role
SELECT role, 
       COUNT(*) AS total_staff, 
       AVG(salary) AS avg_salary
FROM staff
GROUP BY role;

-- 2. Departments with average salary > 35000
SELECT dept_id, AVG(salary) AS avg_sal
FROM staff
GROUP BY dept_id
HAVING AVG(salary) > 35000;

-- 3. Categorize staff into Salary Bands (CASE WHEN)
SELECT staff_name, salary,
  CASE
    WHEN salary >= 80000 THEN 'High'
    WHEN salary >= 35000 THEN 'Medium'
    ELSE 'Low'

        output: `

        `
      },
      {
        id: "sql-04",
        module: "Module 1: MySQL Mastery",
        title: "06. Multi-Table Joins & Anti-Joins",
        badge: "Relationships",
        definition: "INNER JOIN keeps only matches. LEFT JOIN keeps all rows from the primary table. Anti-joins isolate missing entries.",
        instructorCue: "Show students: 'Look at the LEFT JOIN. John and Sara show up with NULL shift hours because they haven't worked any shifts yet!'",
        code: `-- 1. INNER JOIN (Sara is excluded because dept_id is NULL)
SELECT s.staff_name, d.dept_name
FROM staff s
INNER JOIN departments d ON s.dept_id = d.dept_id;

-- 2. LEFT JOIN (Includes Sara with dept_name = NULL)
SELECT s.staff_name, d.dept_name
FROM staff s
LEFT JOIN departments d ON s.dept_id = d.dept_id;

-- 3. Anti-Join: Find staff who worked ZERO shifts
SELECT s.staff_name, s.role
FROM staff s
LEFT JOIN shifts sh ON s.staff_id = sh.staff_id
WHERE sh.shift_id IS NULL;`,

        id: "sql-05",
        module: "Module 1: MySQL Mastery",
        title: "07. Window Functions & CTEs",
        badge: "Advanced SQL",

        instructorCue: "Explain: 'PARTITION BY is like a mini-GROUP BY inside each row, but you don't lose the staff names!'",
        code: `-- 1. Rank staff salary within each department
SELECT staff_name, dept_id, salary,
       DENSE_RANK() OVER (PARTITION BY dept_id ORDER BY salary DESC) as dept_rank
FROM staff;

-- 2. Running Total of hours worked per staff member
SELECT staff_id, shift_date, hours_worked,
       SUM(hours_worked) OVER (PARTITION BY staff_id ORDER BY shift_date) AS running_total
FROM shifts;

-- 3. CTE: Find staff who earn more than their department's average
WITH dept_averages AS (
  SELECT dept_id, AVG(salary) AS avg_sal
  FROM staff
  GROUP BY dept_id
)
SELECT s.staff_name, s.salary, ROUND(d.avg_sal, 2) AS dept_avg
FROM staff s
JOIN dept_averages d ON s.dept_id = d.dept_id
WHERE s.salary > d.avg_sal;`,

        code: `import matplotlib.pyplot as plt

    let currentIndex = 0;
    let isCueMode = false;

    // Initialize UI
    function init() {
      renderSidebar();
      renderPage(0);
      setupEvents();
      lucide.createIcons();
    }

    // Render Sidebar Navigation
    function renderSidebar(filterText = "") {
      const nav = document.getElementById("sidebarNav");
      nav.innerHTML = "";

      let currentModule = "";
      let groupDiv = null;

      curriculum.forEach((item, index) => {
        if (filterText && !item.title.toLowerCase().includes(filterText.toLowerCase()) && !item.definition.toLowerCase().includes(filterText.toLowerCase())) {
          return;
        }

        if (item.module !== currentModule) {
          currentModule = item.module;
          const heading = document.createElement("div");
          heading.className = "text-xs font-bold text-slate-400 uppercase tracking-wider mt-4 mb-2 px-2";
          heading.innerText = currentModule;
          nav.appendChild(heading);
        }

        const link = document.createElement("button");
        link.className = `w-full text-left px-3 py-2 rounded-lg text-xs font-medium transition-all flex items-center justify-between group ${
          index === currentIndex 
            ? "bg-sky-600 text-white shadow-sm" 
            : "text-slate-400 hover:bg-slate-800 hover:text-slate-200"
        }`;
        link.innerHTML = `
          <span class="truncate">${item.title}</span>
          <i data-lucide="chevron-right" class="w-3.5 h-3.5 opacity-0 group-hover:opacity-100 transition-opacity"></i>
        `;
        link.onclick = () => renderPage(index);
        nav.appendChild(link);
      });
      lucide.createIcons();
    }

    // Render Page Content
    function renderPage(index) {
      currentIndex = index;
      const data = curriculum[index];

      // Update Breadcrumbs & Progress
      document.getElementById("breadcrumbModule").innerText = data.module;
      document.getElementById("breadcrumbTitle").innerText = data.title;
      document.getElementById("pageProgress").innerText = `Page ${index + 1} of ${curriculum.length}`;

      // Update Prev / Next Buttons
      document.getElementById("prevBtn").disabled = (index === 0);
      document.getElementById("nextBtn").disabled = (index === curriculum.length - 1);

      // Render Body
      const container = document.getElementById("lessonContent");
      container.innerHTML = `
        <div class="flex items-center gap-3">
          <span class="px-2.5 py-1 rounded-full text-xs font-bold bg-sky-100 text-sky-700">${data.badge}</span>
          <h1 class="text-2xl font-bold text-slate-900">${data.title}</h1>
        </div>

        <p class="text-base text-slate-600">${data.definition}</p>

        <!-- Instructor Cue Box -->
        <div id="cueCard" class="p-4 bg-amber-50 border-l-4 border-amber-500 rounded-r-lg ${isCueMode ? 'block' : 'hidden'} transition-all">
          <div class="flex items-center gap-2 text-amber-900 font-bold text-xs uppercase tracking-wide">
            <i data-lucide="mic" class="w-4 h-4"></i> Instructor Speaking Script
          </div>
          <p class="text-amber-800 text-sm mt-1">${data.instructorCue}</p>
        </div>

        ${data.concept ? data.concept : ''}

        ${data.code ? `
          <div class="bg-slate-900 rounded-xl overflow-hidden shadow-md border border-slate-800">
            <div class="bg-slate-950 px-4 py-2.5 flex items-center justify-between border-b border-slate-800">
              <span class="text-xs font-mono text-slate-400">Hospital Dataset Code Demo</span>
              <button onclick="copyCode(this)" class="text-xs text-sky-400 hover:text-sky-300 font-medium flex items-center gap-1.5 transition-colors">
                <i data-lucide="copy" class="w-3.5 h-3.5"></i> <span>Copy Code</span>
              </button>
            </div>
            <pre class="p-5 text-sm text-slate-200 overflow-x-auto custom-scroll leading-relaxed"><code id="codeBlock">${escapeHtml(data.code)}</code></pre>
          </div>
        ` : ''}

        ${data.output ? `
          <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
            <h4 class="font-bold text-slate-800 text-sm mb-2 flex items-center gap-2">
              <i data-lucide="table" class="w-4 h-4 text-emerald-600"></i> Expected Output & Verification
            </h4>
            <div class="text-xs text-slate-600 overflow-x-auto font-mono leading-relaxed">${formatMarkdownTable(data.output)}</div>
          </div>
        ` : ''}
      `;

      // Scroll to top
      document.getElementById("contentContainer").scrollTop = 0;
      renderSidebar();
      lucide.createIcons();
    }

    // Helper functions
    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function formatMarkdownTable(md) {
      return md.trim().split('\n').map(line => {
        if (line.includes('|')) {
          return `<div class="py-1">${line}</div>`;
        }
        return `<div>${line}</div>`;
      }).join('');
    }

    function copyCode(btn) {
      const code = document.getElementById("codeBlock").innerText;
      navigator.clipboard.writeText(code).then(() => {
        const originalText = btn.innerHTML;
        btn.innerHTML = `<i data-lucide="check" class="w-3.5 h-3.5 text-emerald-400"></i> <span class="text-emerald-400">Copied!</span>`;
        lucide.createIcons();
        setTimeout(() => { btn.innerHTML = originalText; lucide.createIcons(); }, 2000);
      });
    }

    function setupEvents() {
      document.getElementById("prevBtn").onclick = () => { if (currentIndex > 0) renderPage(currentIndex - 1); };
      document.getElementById("nextBtn").onclick = () => { if (currentIndex < curriculum.length - 1) renderPage(currentIndex + 1); };

      document.getElementById("cueModeToggle").onchange = (e) => {
        isCueMode = e.target.checked;
        const card = document.getElementById("cueCard");
        if (card) {
          if (isCueMode) card.classList.remove("hidden");
          else card.classList.add("hidden");
        }
      };

      document.getElementById("searchInput").oninput = (e) => {
        renderSidebar(e.target.value);
      };

      // Keyboard arrow shortcuts
      window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight" && currentIndex < curriculum.length - 1) renderPage(currentIndex + 1);
        if (e.key === "ArrowLeft" && currentIndex > 0) renderPage(currentIndex - 1);
      });
    }

    // Run
    window.onload = init;
  </script>
