<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Data Analyst Training Portal</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #0284c7;
    }
    .markdown-section pre {
      border-radius: 8px;
    }
    .pagination-item-title {
      font-weight: 600;
      color: #0284c7;
    }
    .callout-box {
      background: #f0f9ff;
      border-left: 4px solid #0284c7;
      padding: 12px 16px;
      margin: 16px 0;
      border-radius: 0 6px 6px 0;
    }
  </style>
</head>
<body>
  <div id="app">Loading course material...</div>
  <script>
    window.$docsify = {
      name: 'Data Analyst Portal',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      pagination: {
        previousText: '← Previous Topic',
        nextText: 'Next Topic →',
        crossChapter: true,
        crossChapterText: true
      },
      search: {
        placeholder: 'Search topics (SQL, DAX, Python)...',
        noData: 'No results found',
        depth: 3
      },
      copyCode: {
        buttonText: 'Copy Code',
        errorText: 'Error',
        successText: 'Copied!'
      }
    }
  </script>
  <!-- Docsify Core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Plugins: Search, Code Copy, and Continuous Pagination -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <!-- Syntax Highlighting -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
</body>
</html>
