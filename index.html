
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Data Notes by Tanu | Learn Roadmap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap');
    body { font-family: 'Inter', sans-serif; }
    pre, code { font-family: 'Fira Code', monospace; }
    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .topic-animated {
      animation: fadeIn 0.25s ease-out forwards;
    }

    @media print {
      aside, header, footer, #mobileBackdrop, #cueCard, #loginModal, button {
        display: none !important;
      }
      body, main, #contentContainer {
        height: auto !important;
        overflow: visible !important;
        background: white !important;
      }
      #lessonContent {
        max-width: 100% !important;
        margin: 0 !important;
      }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 flex h-[100dvh] overflow-hidden relative">

  <!-- MOBILE OVERLAY BACKDROP -->
  <div id="mobileBackdrop" class="fixed inset-0 bg-slate-900/60 z-40 hidden md:hidden transition-opacity"></div>

  <!-- LOGIN MODAL -->
  <div id="loginModal" class="fixed inset-0 bg-slate-950/70 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-slate-100 space-y-4">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <div class="flex items-center gap-2 text-slate-900 font-bold">
          <i data-lucide="user-check" class="w-5 h-5 text-sky-600"></i>
          <span>Student & Instructor Login</span>
        </div>
        <button onclick="toggleLoginModal()" class="text-slate-400 hover:text-slate-700 p-1">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Your Full Name</label>
          <input type="text" id="loginNameInput" placeholder="e.g. Rahul Sharma" 
            class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Role</label>
          <select id="loginRoleInput" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
            <option value="Student">Student</option>
            <option value="Instructor">Instructor</option>
          </select>
        </div>
      </div>

      <div class="flex gap-2 pt-2">
        <button onclick="saveUserLogin()" class="flex-1 py-2 rounded-lg bg-sky-600 hover:bg-sky-700 text-white font-semibold text-xs transition-all shadow-sm">
          Save & Log In
        </button>
        <button onclick="logoutUser()" class="px-3 py-2 rounded-lg border border-slate-200 text-rose-600 hover:bg-rose-50 font-semibold text-xs transition-all">
          Logout
        </button>
      </div>
    </div>
  </div>

  <!-- SIDEBAR DRAWER -->
  <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-40 w-72 sm:w-80 bg-slate-900 text-slate-300 flex flex-col flex-shrink-0 border-r border-slate-800 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out">
    
    <!-- BRAND HEADER WITH CLICKABLE LOGO -->
    <div class="p-4 sm:p-5 border-b border-slate-800 flex items-center justify-between">
      <div onclick="goToHome()" class="flex items-center gap-3 min-w-0 cursor-pointer group select-none">
        <img src="image/logo.png" alt="Data Notes by Tanu" class="w-11 h-11 rounded-xl object-contain bg-white p-1 shadow-sm flex-shrink-0 border border-slate-700 group-hover:scale-105 group-hover:border-sky-500 transition-all">
        <div class="min-w-0">
          <h1 class="text-white font-bold text-sm sm:text-base leading-tight truncate group-hover:text-sky-400 transition-colors">Data Notes by Tanu</h1>
          <p class="text-[11px] text-sky-400 font-medium mt-0.5 truncate">Learn Roadmap</p>
        </div>
      </div>
      <button id="closeSidebarBtn" class="md:hidden text-slate-400 hover:text-white p-1 rounded-lg">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- WHO IS LOGGED IN (SIDEBAR WIDGET) -->
    <div onclick="toggleLoginModal()" class="px-4 py-2.5 bg-slate-950/70 border-b border-slate-800 flex items-center justify-between cursor-pointer hover:bg-slate-800/60 transition-colors">
      <div class="flex items-center gap-2.5 min-w-0">
        <div id="userAvatarSidebar" class="w-7 h-7 rounded-full bg-sky-600 text-white font-bold text-xs flex items-center justify-center flex-shrink-0">
          ?
        </div>
        <div class="min-w-0">
          <p id="userNameSidebar" class="text-xs font-semibold text-slate-200 truncate">Click to Log In</p>
          <p id="userRoleSidebar" class="text-[10px] text-slate-400">Track Progress</p>
        </div>
      </div>
      <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-slate-500"></i>
    </div>

    <!-- Search Box -->
    <div class="px-4 py-3 border-b border-slate-800">
      <div class="relative">
        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-slate-500"></i>
        <input type="text" id="searchInput" placeholder="Search roadmap topics..." 
          class="w-full bg-slate-800 text-slate-200 text-xs rounded-lg pl-9 pr-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-500 placeholder-slate-500">
      </div>
    </div>

    <!-- Navigation List -->
    <nav class="flex-1 overflow-y-auto custom-scroll p-4 space-y-4" id="sidebarNav"></nav>

    <!-- SOCIAL PROFILES & INSTRUCTOR TOGGLE -->
    <div class="p-4 border-t border-slate-800 bg-slate-950 space-y-3">
      <div class="flex items-center justify-between gap-2 pt-1">
        <a href="https://github.com/tanu-94" target="_blank" rel="noopener noreferrer" 
          class="flex-1 flex items-center justify-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white text-xs font-medium transition-all">
          <i data-lucide="github" class="w-3.5 h-3.5"></i>
          <span>GitHub</span>
        </a>
        <a href="https://linkedin.com/in/" target="_blank" rel="noopener noreferrer" 
          class="flex-1 flex items-center justify-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-sky-900/60 hover:bg-sky-800 text-sky-200 hover:text-white text-xs font-medium transition-all border border-sky-800/50">
          <i data-lucide="linkedin" class="w-3.5 h-3.5"></i>
          <span>LinkedIn</span>
        </a>
      </div>

      <label class="flex items-center justify-between cursor-pointer pt-2 border-t border-slate-800/80">
        <span class="text-[11px] font-semibold text-slate-300 flex items-center gap-1.5">
          <i data-lucide="mic" class="w-3.5 h-3.5 text-amber-400"></i> Instructor Cue Mode
        </span>
        <input type="checkbox" id="cueModeToggle" class="sr-only">
        <div class="w-8 h-4 bg-slate-700 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-amber-500 relative"></div>
      </label>
    </div>
  </aside>

  <!-- MAIN VIEW -->
  <main class="flex-1 flex flex-col h-[100dvh] overflow-hidden bg-white w-full">
    <!-- Header -->
    <header class="h-14 sm:h-16 border-b border-slate-200 px-4 sm:px-8 flex items-center justify-between bg-white flex-shrink-0 z-10">
      <div class="flex items-center gap-2 sm:gap-3 text-xs sm:text-sm text-slate-500 min-w-0">
        <button id="menuToggleBtn" class="md:hidden text-slate-700 hover:text-sky-600 p-1.5 rounded-lg border border-slate-200 flex-shrink-0">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>
        <img onclick="goToHome()" src="image/logo.png" alt="Logo" class="w-7 h-7 rounded-lg object-contain bg-white p-0.5 border border-slate-200 md:hidden flex-shrink-0 cursor-pointer active:scale-95 transition-transform">
        
        <span id="breadcrumbModule" class="font-medium text-slate-700 truncate hidden sm:inline">Module</span>
        <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-slate-400 flex-shrink-0 hidden sm:inline"></i>
        <span id="breadcrumbTitle" class="text-sky-600 font-semibold truncate">Topic Title</span>
      </div>

      <!-- Action Area: Logged-in Tag & PDF Button -->
      <div class="flex items-center gap-2 sm:gap-3 flex-shrink-0">
        <button onclick="toggleLoginModal()" id="userHeaderBtn" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold transition-all">
          <i data-lucide="user" class="w-3.5 h-3.5 text-sky-600"></i>
          <span id="userHeaderLabel" class="max-w-[100px] truncate">Login</span>
        </button>

        <button onclick="window.print()" title="Download PDF of this lesson" class="flex items-center gap-1.5 px-2.5 sm:px-3 py-1.5 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 hover:text-slate-900 text-xs font-medium transition-all shadow-sm">
          <i data-lucide="printer" class="w-3.5 h-3.5 text-sky-600"></i>
          <span class="hidden sm:inline">PDF</span>
        </button>
        <span id="pageProgress" class="text-[11px] sm:text-xs text-slate-400 font-medium pl-1"></span>
      </div>
    </header>

    <!-- Top Visual Progress Bar -->
    <div class="w-full bg-slate-100 h-1 flex-shrink-0">
      <div id="topProgressBar" class="bg-sky-600 h-1 transition-all duration-300" style="width: 0%;"></div>
    </div>

    <!-- Scrollable Content -->
    <div class="flex-1 overflow-y-auto p-4 sm:p-8 custom-scroll bg-slate-50" id="contentContainer">
      <div class="max-w-4xl mx-auto space-y-6 pb-6" id="lessonContent"></div>
    </div>

    <!-- Fixed Bottom Bar -->
    <footer class="h-14 sm:h-16 border-t border-slate-200 px-4 sm:px-8 flex items-center justify-between bg-white flex-shrink-0 z-10">
      <button onclick="goToPrev()" id="prevBtn" class="flex items-center gap-1 sm:gap-2 px-3 sm:px-5 py-1.5 sm:py-2 rounded-lg border border-slate-300 text-slate-700 font-medium text-xs sm:text-sm hover:bg-slate-50 active:scale-95 transition-all disabled:opacity-30 disabled:pointer-events-none">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        <span>Previous</span>
      </button>

      <span class="text-[11px] text-slate-400 hidden sm:inline">Use arrow keys (← / →) to navigate</span>

      <button onclick="goToNext()" id="nextBtn" class="flex items-center gap-1 sm:gap-2 px-3 sm:px-5 py-1.5 sm:py-2 rounded-lg bg-sky-600 text-white font-medium text-xs sm:text-sm hover:bg-sky-700 active:scale-95 transition-all disabled:opacity-30 disabled:pointer-events-none shadow-sm">
        <span>Next</span>
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
    </footer>
  </main>

  <script src="topics.js"></script>

  <script>
    let currentIndex = 0;
    let isCueMode = false;
    let currentUser = JSON.parse(localStorage.getItem("dataRoadmapUser") || 'null');

    const sidebar = document.getElementById("sidebar");
    const mobileBackdrop = document.getElementById("mobileBackdrop");
    const menuToggleBtn = document.getElementById("menuToggleBtn");
    const closeSidebarBtn = document.getElementById("closeSidebarBtn");
    const loginModal = document.getElementById("loginModal");

    function toggleLoginModal() {
      loginModal.classList.toggle("hidden");
      if (!loginModal.classList.contains("hidden") && currentUser) {
        document.getElementById("loginNameInput").value = currentUser.name;
        document.getElementById("loginRoleInput").value = currentUser.role;
      }
    }

    function saveUserLogin() {
      const name = document.getElementById("loginNameInput").value.trim();
      const role = document.getElementById("loginRoleInput").value;
      if (!name) return alert("Please enter your name.");
      currentUser = { name, role };
      localStorage.setItem("dataRoadmapUser", JSON.stringify(currentUser));
      updateUserUI();
      toggleLoginModal();
    }

    function logoutUser() {
      currentUser = null;
      localStorage.removeItem("dataRoadmapUser");
      updateUserUI();
      toggleLoginModal();
    }

    function updateUserUI() {
      if (currentUser) {
        const initials = currentUser.name.split(" ").map(n => n[0]).join("").toUpperCase().substring(0, 2);
        document.getElementById("userNameSidebar").innerText = currentUser.name;
        document.getElementById("userRoleSidebar").innerText = `${currentUser.role} • Active`;
        document.getElementById("userAvatarSidebar").innerText = initials;
        document.getElementById("userHeaderLabel").innerText = currentUser.name;
        if (currentUser.role === "Instructor") {
          document.getElementById("cueModeToggle").checked = true;
          isCueMode = true;
        }
      } else {
        document.getElementById("userNameSidebar").innerText = "Click to Log In";
        document.getElementById("userRoleSidebar").innerText = "Track Progress";
        document.getElementById("userAvatarSidebar").innerText = "?";
        document.getElementById("userHeaderLabel").innerText = "Login";
      }
      const cue = document.getElementById("cueCard");
      if (cue) cue.classList.toggle("hidden", !isCueMode);
      lucide.createIcons();
    }

    function openMobileSidebar() {
      sidebar.classList.remove("-translate-x-full");
      mobileBackdrop.classList.remove("hidden");
    }

    function closeMobileSidebar() {
      sidebar.classList.add("-translate-x-full");
      mobileBackdrop.classList.add("hidden");
    }

    function goToHome() {
      const search = document.getElementById("searchInput");
      if (search) search.value = "";
      renderSidebar();
      renderPage(0);
      if (window.innerWidth < 768) closeMobileSidebar();
    }

    function goToPrev() {
      if (currentIndex > 0) renderPage(currentIndex - 1);
    }

    function goToNext() {
      if (currentIndex < curriculum.length - 1) renderPage(currentIndex + 1);
    }

    function getLevelInfo(moduleName, index) {
      if (moduleName.includes("Module 0") || moduleName.includes("Excel") || index < 15) {
        return { label: "Beginner", color: "bg-emerald-100 text-emerald-800 border-emerald-200", time: "10-15 min" };
      } else if (moduleName.includes("MySQL") || moduleName.includes("Python")) {
        return { label: "Intermediate", color: "bg-amber-100 text-amber-800 border-amber-200", time: "15-20 min" };
      }
      return { label: "Advanced", color: "bg-purple-100 text-purple-800 border-purple-200", time: "20-25 min" };
    }

    function init() {
      if (typeof curriculum === 'undefined' || !curriculum.length) {
        document.getElementById('lessonContent').innerHTML = '<p class="text-red-500 font-medium p-4">Curriculum data not found in topics.js.</p>';
        return;
      }
      updateUserUI();
      renderSidebar();
      renderPage(0);
      setupEvents();
      lucide.createIcons();
    }

    function renderSidebar(filter = "") {
      const nav = document.getElementById("sidebarNav");
      nav.innerHTML = "";
      let currentMod = "";

      curriculum.forEach((item, idx) => {
        if (filter && !item.title.toLowerCase().includes(filter.toLowerCase()) && !item.meaning.toLowerCase().includes(filter.toLowerCase())) return;

        if (item.module !== currentMod) {
          currentMod = item.module;
          const h = document.createElement("div");
          h.className = "text-xs font-bold text-slate-400 uppercase tracking-wider mt-4 mb-2 px-2";
          h.innerText = currentMod;
          nav.appendChild(h);
        }

        const btn = document.createElement("button");
        btn.className = `w-full text-left px-3 py-2 rounded-lg text-xs font-medium transition-all ${
          idx === currentIndex ? "bg-sky-600 text-white font-semibold shadow-sm" : "text-slate-400 hover:bg-slate-800 hover:text-slate-200"
        }`;
        btn.innerText = item.title;
        btn.onclick = () => {
          renderPage(idx);
          if (window.innerWidth < 768) closeMobileSidebar();
        };
        nav.appendChild(btn);
      });
      lucide.createIcons();
    }

    function renderPage(idx) {
      currentIndex = idx;
      const data = curriculum[idx];
      const level = getLevelInfo(data.module, idx);
      const progressPercent = Math.round(((idx + 1) / curriculum.length) * 100);

      document.getElementById("breadcrumbModule").innerText = data.module;
      document.getElementById("breadcrumbTitle").innerText = data.title;
      document.getElementById("pageProgress").innerText = `${progressPercent}% (${idx + 1}/${curriculum.length})`;
      document.getElementById("topProgressBar").style.width = `${progressPercent}%`;

      document.getElementById("prevBtn").disabled = (idx === 0);
      document.getElementById("nextBtn").disabled = (idx === curriculum.length - 1);

      const container = document.getElementById("lessonContent");
      container.className = "max-w-4xl mx-auto space-y-6 pb-6 topic-animated";

      container.innerHTML = `
        <div class="space-y-4">
          <!-- BADGES -->
          <div class="flex flex-wrap items-center gap-2">
            <span class="px-2.5 py-0.5 rounded-full text-xs font-bold border ${level.color}">
              ${level.label}
            </span>
            <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 border border-slate-200 flex items-center gap-1">
              <i data-lucide="clock" class="w-3 h-3 text-slate-500"></i> ${level.time}
            </span>
            <span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-sky-100 text-sky-800 border border-sky-200">
              ${data.section || 'Core Roadmap'}
            </span>
          </div>

          <h1 class="text-xl sm:text-3xl font-extrabold text-slate-900 tracking-tight leading-snug">${data.title}</h1>

          <!-- DEFINITION CARD -->
          <div class="bg-white p-4 sm:p-6 rounded-2xl border border-slate-200/90 shadow-sm space-y-3">
            <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
              <i data-lucide="book-open" class="w-4 h-4 text-sky-600"></i> Definition & Meaning
            </h4>
            <p class="text-slate-800 text-sm sm:text-base font-medium leading-relaxed">${data.definition}</p>
            <p class="text-slate-600 text-xs sm:text-sm leading-relaxed">${data.meaning}</p>
          </div>

          <!-- INSTRUCTOR CUE -->
          <div id="cueCard" class="p-4 bg-amber-50/90 border-l-4 border-amber-500 rounded-r-xl ${isCueMode ? 'block' : 'hidden'}">
            <div class="flex items-center gap-2 text-amber-900 font-bold text-xs uppercase tracking-wide">
              <i data-lucide="mic" class="w-4 h-4"></i> Instructor Speaking Script
            </div>
            <p class="text-amber-800 text-xs sm:text-sm mt-1.5 leading-relaxed">${data.instructorCue || data.meaning}</p>
          </div>

          <!-- SYNTAX BLOCK -->
          ${data.syntax ? `
            <div class="bg-slate-900 rounded-2xl overflow-hidden border border-slate-800 shadow-sm">
              <div class="bg-slate-950 px-4 py-2.5 text-xs font-mono text-slate-400 border-b border-slate-800 flex items-center gap-2">
                <i data-lucide="terminal" class="w-3.5 h-3.5 text-emerald-400"></i>
                <span>Syntax / Steps</span>
              </div>
              <pre class="p-4 text-xs font-mono text-emerald-400 overflow-x-auto leading-relaxed">${escapeHtml(data.syntax)}</pre>
            </div>
          ` : ''}

          <!-- CODE / DEMONSTRATION -->
          ${data.example ? `
            <div class="bg-slate-900 rounded-2xl overflow-hidden border border-slate-800 shadow-md">
              <div class="bg-slate-950 px-4 py-2.5 text-xs font-mono text-slate-400 border-b border-slate-800 flex justify-between items-center">
                <div class="flex items-center gap-2">
                  <i data-lucide="code" class="w-3.5 h-3.5 text-sky-400"></i>
                  <span>Worked Example / Demonstration</span>
                </div>
                <button onclick="copyCode(this)" class="text-sky-400 hover:text-sky-300 text-xs font-sans font-medium flex items-center gap-1">
                  <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                  <span>Copy</span>
                </button>
              </div>
              <pre class="p-4 text-xs font-mono text-slate-200 overflow-x-auto leading-relaxed"><code id="codeBlock">${escapeHtml(data.example)}</code></pre>
            </div>
          ` : ''}

          <!-- ANALYST DECISION BOX / QUESTION BOX -->
          ${data.decisionBox ? `
            <div class="bg-gradient-to-br from-indigo-50/90 to-sky-50/90 border border-indigo-200/80 rounded-2xl p-4 sm:p-6 shadow-sm space-y-3">
              <div class="flex items-center justify-between">
                <h4 class="text-xs font-bold uppercase tracking-wider text-indigo-900 flex items-center gap-2">
                  <i data-lucide="help-circle" class="w-4 h-4 text-indigo-600"></i>
                  <span>Analyst Decision Box (Critical Thinking)</span>
                </h4>
                <span class="text-[10px] font-semibold bg-indigo-100 text-indigo-800 px-2 py-0.5 rounded-full">Interview Scenario</span>
              </div>
              <p class="text-slate-900 text-xs sm:text-sm font-semibold">${data.decisionBox.question}</p>
              
              <details class="group bg-white rounded-xl border border-indigo-100 p-3 text-xs transition-all">
                <summary class="font-semibold text-indigo-700 cursor-pointer flex items-center justify-between select-none">
                  <span>How should an analyst decide? (Click to Reveal Decision Guide)</span>
                  <span class="text-indigo-400 font-mono group-open:rotate-180 transition-transform">▼</span>
                </summary>
                <div class="mt-3 pt-3 border-t border-indigo-50 text-slate-700 space-y-2 leading-relaxed">
                  <p class="font-medium text-indigo-950">${data.decisionBox.decision}</p>
                  <p class="text-slate-600 text-[11px]">${data.decisionBox.tradeoff}</p>
                </div>
              </details>
            </div>
          ` : ''}

          <!-- PRACTICE EXERCISE -->
          ${data.practice ? `
            <div class="bg-white p-4 sm:p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
              <div class="flex items-center justify-between">
                <h4 class="text-xs font-bold uppercase tracking-wider text-sky-600 flex items-center gap-1.5">
                  <i data-lucide="pen-tool" class="w-4 h-4"></i> Practice Exercise
                </h4>
                <span class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Hands-on Task</span>
              </div>
              
              <p class="text-slate-800 text-sm sm:text-base font-medium leading-relaxed">${data.practice}</p>

              <div class="space-y-2 pt-1">
                ${data.hint ? `
                  <details class="group border border-amber-200 bg-amber-50/60 rounded-xl overflow-hidden text-xs transition-all">
                    <summary class="p-3 font-semibold text-amber-900 cursor-pointer flex items-center justify-between select-none hover:bg-amber-100/60">
                      <span class="flex items-center gap-1.5">
                        <i data-lucide="lightbulb" class="w-3.5 h-3.5 text-amber-500"></i>
                        <span>Need a Hint?</span>
                      </span>
                      <span class="text-amber-700 text-xs font-mono group-open:rotate-180 transition-transform">▼</span>
                    </summary>
                    <div class="px-3 pb-3 text-amber-800 border-t border-amber-200/60 pt-2 leading-relaxed">
                      ${data.hint}
                    </div>
                  </details>
                ` : ''}

                ${data.answer ? `
                  <details class="group border border-slate-800 bg-slate-900 rounded-xl overflow-hidden text-xs shadow-sm transition-all">
                    <summary class="p-3 font-semibold text-slate-200 cursor-pointer flex items-center justify-between select-none bg-slate-950 hover:bg-slate-900/80">
                      <span class="flex items-center gap-1.5 text-sky-400">
                        <i data-lucide="eye" class="w-3.5 h-3.5"></i>
                        <span>Reveal Solution</span>
                      </span>
                      <span class="text-slate-400 text-xs font-mono group-open:rotate-180 transition-transform">▼</span>
                    </summary>
                    <div class="p-3.5 text-emerald-400 font-mono overflow-x-auto border-t border-slate-800 leading-relaxed whitespace-pre-wrap">${escapeHtml(data.answer)}</div>
                  </details>
                ` : ''}
              </div>
            </div>
          ` : ''}

          ${data.extra ? `<div class="bg-white p-4 sm:p-5 rounded-xl border border-slate-200 text-xs sm:text-sm text-slate-700">${data.extra}</div>` : ''}
        </div>
      `;

      document.getElementById("contentContainer").scrollTop = 0;
      renderSidebar();
      lucide.createIcons();
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function copyCode(btn) {
      const code = document.getElementById("codeBlock").innerText;
      navigator.clipboard.writeText(code).then(() => {
        const originalText = btn.innerHTML;
        btn.innerHTML = `<span class="text-emerald-400 font-semibold">Copied!</span>`;
        setTimeout(() => { btn.innerHTML = originalText; }, 2000);
      });
    }

    function setupEvents() {
      menuToggleBtn.onclick = openMobileSidebar;
      closeSidebarBtn.onclick = closeMobileSidebar;
      mobileBackdrop.onclick = closeMobileSidebar;

      document.getElementById("cueModeToggle").onchange = (e) => {
        isCueMode = e.target.checked;
        const c = document.getElementById("cueCard");
        if (c) c.classList.toggle("hidden", !isCueMode);
      };

      document.getElementById("searchInput").oninput = (e) => renderSidebar(e.target.value);

      window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight") goToNext();
        if (e.key === "ArrowLeft") goToPrev();
      });
    }

    window.onload = init;
  </script>
</body>
</html>
